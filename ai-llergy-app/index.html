<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-llergy | Mosaic</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Disclaimer Modal -->
    <div id="disclaimer-modal" class="modal">
        <div class="modal-content">
            <h1>Disclaimer</h1>
            <p>
                Our menu may contain allergens. Please inform your server of any dietary restrictions.
                Consumption of raw or undercooked ingredients may increase risk of foodborne illness.
                While we take every precaution, cross-contamination is possible.
            </p>
            <button id="agree-btn" class="btn primary-btn">I Agree</button>
        </div>
    </div>

    <!-- Main App Content -->
    <div class="app-container">
        <header>
            <img src="assets/images/logo.png" alt="Mosaic Logo" class="logo">
            <h1>AI-llergy</h1>
            <p class="subtitle">Select allergens to avoid</p>
        </header>

        <main>
            <div class="allergen-grid">
                <!-- Generated by JS or Hardcoded for demo -->
                <button class="allergen-option" data-allerge="dairy">
                    <span class="icon">🥛</span>
                    <span class="label">Dairy</span>
                </button>
                <button class="allergen-option" data-allerge="gluten">
                    <span class="icon">🌾</span>
                    <span class="label">Gluten</span>
                </button>
                <button class="allergen-option" data-allerge="nuts">
                    <span class="icon">🥜</span>
                    <span class="label">Nuts</span>
                </button>
                <button class="allergen-option" data-allerge="eggs">
                    <span class="icon">🥚</span>
                    <span class="label">Eggs</span>
                </button>
                <button class="allergen-option" data-allerge="soy">
                    <span class="icon">🌱</span>
                    <span class="label">Soy</span>
                </button>
                <button class="allergen-option" data-allerge="shellfish">
                    <span class="icon">🐚</span>
                    <span class="label">Shellfish</span>
                </button>
                <button class="allergen-option" data-allerge="fish">
                    <span class="icon">🐟</span>
                    <span class="label">Fish</span>
                </button>
                <button class="allergen-option" data-allerge="sesame">
                    <span class="icon">🥯</span>
                    <span class="label">Sesame</span>
                </button>
            </div>

            <div class="input-group">
                <input type="text" placeholder="Add specific allergies or preferences..." id="custom-allergy">
            </div>

            <div class="action-area">
                <button id="submit-btn" class="btn primary-btn full-width">SUBMIT</button>
            </div>
        </main>
    </div>

    <script src="js/script.js"></script>
</body>

</html>
